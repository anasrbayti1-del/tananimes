<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanime's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand"><h1>Tanime<span>'</span>s</h1><small>Dein privates Anime-Archiv</small></div>
  <div class="header-actions">
    <button class="addbtn ghostbtn" id="openMassAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Mehrere hinzufügen
    </button>
    <input type="file" id="massAddInput" accept="image/*" multiple style="display:none;">
    <button class="addbtn" id="openAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Anime hinzufügen
    </button>
  </div>
</header>

<div class="carousel-section" id="carouselSection">
  <div class="carousel-head"><h2>Deine Sammlung</h2><small>zum Anhalten Cover berühren</small></div>
  <div class="carousel-viewport">
    <div class="carousel-track" id="carouselTrack"></div>
  </div>
</div>

<div class="dash" id="dash"></div>

<main>
  <div class="sectionhead">
    <h2 id="countLabel">Meine Animes</h2>
    <div class="toolsrow">
      <div class="toolsrow-top">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="search" id="searchInput" placeholder="Anime suchen...">
        </div>
        <select class="sortsel" id="sortSelect">
          <option value="added_desc">Zuletzt hinzugefügt</option>
          <option value="watched_desc">Zuletzt gesehen</option>
          <option value="rating_desc">Beste Bewertung</option>
          <option value="rating_asc">Schlechteste Bewertung</option>
          <option value="progress_desc">Fortschritt (meiste Folgen)</option>
          <option value="priority_desc">Priorität (Watchlist)</option>
          <option value="name_asc">Alphabetisch (A–Z)</option>
        </select>
      </div>
      <div class="filters-row">
        <span class="flbl">Filter</span>
        <div class="filters">
          <button class="chip active" data-filter="all">Alle</button>
          <button class="chip" data-filter="watchlist">🕓 Watchlist</button>
          <button class="chip" data-filter="watching">▶ Schaue gerade</button>
          <button class="chip" data-filter="dropped">✕ Abgebrochen</button>
          <button class="chip" data-filter="fav">★ Favoriten</button>
          <button class="chip" data-filter="video">Mit Edit</button>
        </div>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- Add/Edit Modal -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <button class="closex" id="closeAdd">✕</button>
    <h2 id="formTitle">Anime hinzufügen</h2>
    <form id="animeForm">
      <div class="field">
        <label>Anime-Name</label>
        <input type="text" id="f_name" required placeholder="z. B. Vinland Saga">
      </div>
      <div class="field">
        <label>Cover</label>
        <div class="upload" id="coverUpload">
          <span id="coverUploadText">Bild hochladen oder hierher ziehen</span>
          <input type="file" id="f_cover" accept="image/*">
        </div>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f_status">
          <option value="watchlist">🕓 Watchlist (später schauen)</option>
          <option value="watching">▶ Schaue gerade</option>
          <option value="done">✓ Fertig geschaut</option>
          <option value="dropped">✕ Abgebrochen</option>
        </select>
      </div>
      <div class="field" id="priorityField" style="display:none;">
        <label>Priorität <span style="color:#6d6d76;">(wie sehr willst du das schauen?)</span></label>
        <select id="f_priority">
          <option value="high">🔥 Hoch – unbedingt bald</option>
          <option value="normal">Normal</option>
          <option value="low">Irgendwann mal</option>
        </select>
      </div>
      <div class="row2">
        <div class="field" id="ratingField">
          <label>Bewertung (0–10)</label>
          <input type="number" id="f_rating" min="0" max="10" step="0.1" placeholder="8.5">
        </div>
        <div class="field">
          <label>Anzahl Folgen (gesamt)</label>
          <input type="number" id="f_episodes" min="0" placeholder="24">
        </div>
      </div>
      <div class="field" id="progressField" style="display:none;">
        <label>Aktuelle Folge <span style="color:#6d6d76;">(bei welcher Folge bist du?)</span></label>
        <input type="number" id="f_currentEpisode" min="0" placeholder="z. B. 7">
      </div>
      <div class="field">
        <label>Kommentar</label>
        <textarea id="f_comment" rows="3" placeholder="Deine persönliche Meinung..."></textarea>
      </div>
      <div class="field" id="watchedField">
        <label>Gesehen am <span style="color:#6d6d76;">(Monat/Jahr reicht auch)</span></label>
        <input type="month" id="f_watched">
      </div>
      <div class="field">
        <label>Video-Link (TikTok, YouTube, Edit ...)</label>
        <input type="url" id="f_videolink" placeholder="https://...">
      </div>
      <div class="field">
        <label>Weitere Notizen</label>
        <textarea id="f_notes" rows="2" placeholder="Optional..."></textarea>
      </div>
      <div class="field">
        <div class="favtoggle" id="favToggle"><span class="dot">★</span> Als Favorit markieren</div>
      </div>
      <div class="formactions">
        <button type="button" class="btn danger" id="deleteBtn" style="display:none;">Löschen</button>
        <button type="button" class="btn ghost" id="cancelAdd">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal"></div>
</div>

<!-- Undo-Toasts (z.B. nach dem Löschen) -->
<div id="toastContainer"></div>

<script src="script.js"></script>
</body>
</html>
